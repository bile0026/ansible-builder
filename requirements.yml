# Pinned to current releases; all support ansible-core 2.18.
# Check requires_ansible on Galaxy before bumping: ansible-galaxy does not skip
# versions that need a newer ansible-core than the image has.
collections:
  - name: ansible.netcommon
    version: "8.7.0"
  - name: ansible.utils
    version: "6.1.1"
  - name: ansible.network
    version: "5.0.0"
  - name: ansible.posix
    version: "2.2.2"
  - name: community.general
    version: "13.4.0"
  - name: networktocode.nautobot
    version: "6.3.0"
  - name: community.routeros
    version: "3.22.0"
  - name: cisco.asa
    version: "7.0.0"
  - name: cisco.ios
    version: "11.6.0"
  - name: cisco.iosxr
    version: "12.5.0"
  - name: cisco.nxos
    version: "13.0.0"
  - name: junipernetworks.junos
    version: "11.1.1"
  - name: arista.eos
    version: "12.3.0"
  - name: paloaltonetworks.panos
    version: "3.4.2"
  # Transitive dependencies, pinned for reproducible builds
  - name: juniper.device
    version: "2.0.5"
  - name: community.library_inventory_filtering_v1
    version: "1.1.5"
