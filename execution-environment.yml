---
version: 3

# Pinned to the EE that ships with AWX 24.6.1:
#   CentOS Stream 9, Python 3.9 (/usr/bin/python3), ansible-core 2.15.12, ansible-runner 2.4.0
# Collection pins in requirements.yml must stay compatible with ansible-core 2.15.
images:
  base_image:
    name: quay.io/ansible/awx-ee:24.6.1

dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_steps:
  append_final:
    # append_final runs as root, so configure LFS system-wide rather than in /root
    - RUN git lfs install --system
